name: Defect Report Reminders

on:
  schedule:
    # 00:30 UTC = 07:30 WIB (Asia/Jakarta), setiap hari.
    # Logika hari-kerja ada di scripts/send-reminders.mjs, jadi dijalankan
    # setiap hari saja; skrip yang menentukan apakah hari ini due date.
    - cron: '30 0 * * *'
  workflow_dispatch: {} # tombol "Run workflow" manual untuk uji coba

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          EMAILJS_REMINDER_TEMPLATE_ID: ${{ secrets.EMAILJS_REMINDER_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
        run: node scripts/send-reminders.mjs
