<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Defect Report Tracker</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Converts /<repo>/login → /<repo>/?p=/login
      // The repo segment is read from the URL, so renaming the repo needs no edit here.
      var repo = '/' + window.location.pathname.split('/')[1];
      var path = window.location.pathname.slice(repo.length) || '/';
      var search = window.location.search;
      var hash = window.location.hash;
      var redirectUrl = repo + '/?p=' + encodeURIComponent(path + search) + hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
